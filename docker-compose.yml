services:
  jenkins:
    build: .
    container_name: jenkins-master
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ~/.ssh/id_ed25519:/var/jenkins_home/.ssh/id_ed25519:ro
      - ~/docker-certs/ca.pem:/var/jenkins_home/.docker/ca.pem:ro
      - ~/docker-certs/client-cert.pem:/var/jenkins_home/.docker/cert.pem:ro
      - ~/docker-certs/client-key.pem:/var/jenkins_home/.docker/key.pem:ro
    restart: unless-stopped
    environment:
      - DOCKER_HOST_1=tcp://xxx.xxx.xxx.xxx:2376
      - DOCKER_HOST_2=tcp://xxx.xxx.xxx.xxx:2376
    networks:
      - jenkins
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
