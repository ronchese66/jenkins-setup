services:
  jenkins:
    build: .
    container_name: jenkins-master
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ~/.ssh/id_ed25519:/var/jenkins_home/.ssh/id_ed25519:ro
    restart: unless-stopped
    networks:
      - jenkins
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
